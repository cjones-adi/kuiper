# phosphor-hwmon configuration for the ADM1600 (content template).
#
# Installed at first boot to /etc/default/obmc/hwmon/<OF-instance>.conf by
# obmc-hwmon-adm1600-setup.sh — the exact filename mirrors the device's
# device-tree path (systemd %I), which is only known on the running Pi.
#
# Only the three LINEAR11 "standard" hwmon channels the ADM1600 driver exposes
# are phosphor-hwmon-native (in1/curr1/power1 -> voltage/current/power). The
# custom IEEE-754 attributes (duty_cycle, pid*, scale_*, ...) are NOT hwmon
# sensors and are handled separately (see adm1600 driver notes).

# D-Bus busname suffix: xyz.openbmc_project.Hwmon-adm1600.Hwmon1
HW_SENSOR_ID=adm1600

# Sensor labels -> D-Bus /xyz/openbmc_project/sensors/<type>/<label>
LABEL_in1=adm1600_Vin
LABEL_curr1=adm1600_Iin
LABEL_power1=adm1600_Pin
