<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Allow the ADM1600 OpenBMC daemons (all run as root) to own and use the
  xyz.openbmc_project.* names they publish. Debian's default system-bus policy
  denies own="*", so without this phosphor-hwmon's per-instance busname and the
  bmc-assoc inventory service cannot claim their names. Upstream ships a
  per-name .conf (see xyz.openbmc_project.ObjectMapper.conf); this covers the
  names created at runtime whose exact suffix isn't known at build time.
-->
<busconfig>
  <!--
    Debian's /usr/share/dbus-1/system.conf punches only a "<deny
    send_type=method_call/>" default and expects each service to open holes.
    Per-destination / send_destination_prefix holes are NOT enough for the
    OpenBMC model: phosphor-objmgr (mapperx) DISCOVERS objects by walking
    org.freedesktop.DBus.Introspectable.Introspect on every busname, and that
    discovery walk (like `busctl introspect`/`tree`) addresses peers by their
    resolved unique name (:1.x), which send_destination_prefix does not reliably
    match -> Introspect is denied even though GetManagedObjects (addressed by
    well-known name) succeeds. Net effect: phosphor-hwmon publishes the sensors
    fine, but the mapper can't index them, so /xyz/openbmc_project/sensors stays
    empty and Redfish returns Sensors: []. Real OpenBMC ships a wide-open
    intra-service bus; mirror that here with a blanket method_call hole. This is
    a dev bench with bmcweb auth disabled, so the open bus is acceptable; and
    security-sensitive system services (systemd1, NetworkManager, login1, ...)
    keep their own restrictive .conf files, whose denies still override this.
  -->
  <policy user="root">
    <allow own_prefix="xyz.openbmc_project"/>
    <allow send_type="method_call"/>
    <allow receive_sender="xyz.openbmc_project.ObjectMapper"/>
  </policy>
  <policy context="default">
    <allow send_type="method_call"/>
    <allow receive_sender="xyz.openbmc_project.ObjectMapper"/>
    <allow receive_sender="xyz.openbmc_project.User.Manager"/>
  </policy>
</busconfig>
