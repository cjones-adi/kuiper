# bmc-assoc config for the ADM1600 hot-swap controller.
# Installed to /etc/bmc-assoc/adm1600.conf by stage 09.
#
# Publishes /xyz/openbmc_project/inventory/system/chassis/adm1600 and links it
# (all_sensors) to the phosphor-hwmon sensors named by adm1600-hwmon.conf, so
# bmcweb exposes /redfish/v1/Chassis/adm1600/Sensors.
#
# DROP-IN MODEL: add another hwmon device by copying this file to
#   /etc/bmc-assoc/<device>.conf
# editing the fields below, and running:  systemctl restart bmc-assoc
# No recompile, no image rebuild.
#
# The SENSOR subpaths MUST match the device's phosphor-hwmon LABEL_* values.
# The hwmon channel decides the <type> segment; LABEL_* decides the leaf:
#   LABEL_in1    -> voltage/<label>
#   LABEL_curr1  -> current/<label>
#   LABEL_power1 -> power/<label>
#   LABEL_temp1  -> temperature/<label>
#   LABEL_fan1   -> fan_tach/<label>

CHASSIS=adm1600
NAME=adm1600
SENSOR=voltage/adm1600_Vin
SENSOR=current/adm1600_Iin
SENSOR=power/adm1600_Pin
