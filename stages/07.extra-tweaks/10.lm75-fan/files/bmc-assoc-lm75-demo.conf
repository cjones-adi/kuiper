# bmc-assoc config for the LM75 + PWM-fan "Hello World" demo.
# Installed to /etc/bmc-assoc/lm75-demo.conf by stage 07/10.lm75-fan.
#
# Publishes /xyz/openbmc_project/inventory/system/chassis/lm75-demo and links it
# (all_sensors) to the phosphor-hwmon sensors, so bmcweb exposes
#   /redfish/v1/Chassis/lm75-demo/Sensors
# and the web UI's Sensors page lists them.
#
# The SENSOR subpaths MUST match the phosphor-hwmon LABEL_* values:
#   LABEL_temp1=Ambient     -> temperature/Ambient   (lm75-hwmon.conf)
#   LABEL_fan1=ChassisFan   -> fan_tach/ChassisFan    (pwmfan-hwmon.conf)

CHASSIS=lm75-demo
NAME=lm75-demo
SENSOR=temperature/Ambient
SENSOR=fan_tach/ChassisFan
