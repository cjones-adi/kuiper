# phosphor-hwmon configuration for the LM75 temperature sensor (demo).
#
# Installed at first boot to /etc/default/obmc/hwmon/<OF-instance>.conf by
# obmc-hwmon-dev-setup.sh (the %I filename mirrors the device's device-tree
# path, known only on the running Pi).

# D-Bus busname suffix: xyz.openbmc_project.Hwmon-lm75.Hwmon1
HW_SENSOR_ID=lm75

# temp1 (m°C) -> /xyz/openbmc_project/sensors/temperature/Ambient -> Redfish
LABEL_temp1=Ambient

# Threshold (bonus): the lm75 driver exposes temp1_max (writable). phosphor-hwmon
# surfaces it as the sensor's warning threshold, so it is readable AND PATCH-able
# over Redfish at .../Sensors/temperature_Ambient (Thresholds.UpperCaution).
# NOTE: this is the Redfish ALARM threshold only -- it does NOT retune the fan.
# The fan responds to the kernel thermal-zone trips (45C/60C) in the overlay.
