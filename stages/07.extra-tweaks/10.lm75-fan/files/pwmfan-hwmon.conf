# phosphor-hwmon configuration for the PWM fan (demo).
#
# The pwm-fan driver registers its hwmon device with name "pwmfan" and exposes
# fan1_input (measured RPM, from the tachometer on GPIO23). We publish only the
# RPM reading -- the PWM duty is driven by the kernel thermal zone, not the BMC.

# D-Bus busname suffix: xyz.openbmc_project.Hwmon-pwmfan.Hwmon1
HW_SENSOR_ID=pwmfan

# fan1 (RPM) -> /xyz/openbmc_project/sensors/fan_tach/ChassisFan -> Redfish
LABEL_fan1=ChassisFan
